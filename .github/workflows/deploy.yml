name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build
        working-directory: shipcraft
        run: node build.mjs
      - name: Verify build output
        run: |
          test -f shipcraft/dist/index.html
          test -f shipcraft/dist/tr/index.html
          test -f shipcraft/dist/form.php
          test -f shipcraft/dist/.htaccess
          # Agent-readiness artefacts: fail the deploy if any stops being generated.
          test -f shipcraft/dist/about/index.html
          test -f shipcraft/dist/contact/index.html
          test -f shipcraft/dist/terms/index.html
          test -f shipcraft/dist/privacy/index.html
          test -f shipcraft/dist/index.md
          test -f shipcraft/dist/about/index.md
          test -f shipcraft/dist/tr/hakkinda/index.html
          test -f shipcraft/dist/tr/iletisim/index.html
          test -f shipcraft/dist/.well-known/mcp/server-card.json
          grep -q 'Content-Signal' shipcraft/dist/robots.txt
          grep -q 'rel="llms-txt"' shipcraft/dist/.htaccess
      - name: Upload to hosting
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: shipcraft/dist/
          server-dir: /public_html/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
