<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pulse Studio — template</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600&display=swap">
<style>
:root{--lime:#c8ff2e;--k:#08080a}*{box-sizing:border-box}body{margin:0;background:var(--k);color:#fff;font:400 17px/1.5 Archivo,sans-serif;overflow-x:hidden}
.bg{position:fixed;inset:0;background:radial-gradient(45% 50% at 80% 40%,#c8ff2e33,transparent 70%),radial-gradient(40% 40% at 0% 100%,#7b2cff44,transparent 70%);z-index:-1}
nav{display:flex;justify-content:space-between;align-items:center;padding:26px 5vw}nav b{font:400 30px Anton,sans-serif;letter-spacing:.04em}nav a{background:var(--lime);color:#000;padding:12px 22px;border-radius:99px;font-weight:600;text-decoration:none}
.hero{padding:3vw 5vw;position:relative}h1{font:400 clamp(80px,15vw,240px)/.9 Anton,sans-serif;text-transform:uppercase;margin:0}h1 span{color:transparent;-webkit-text-stroke:2px var(--lime)}
.s{position:absolute;right:6vw;top:10%;width:min(28vw,360px);aspect-ratio:1;border-radius:50%;background:conic-gradient(from 0deg,var(--lime),#7b2cff,var(--lime));opacity:.9;mix-blend-mode:screen;animation:r 12s linear infinite}@keyframes r{to{transform:rotate(360deg)}}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}.row span{border:1px solid #ffffff44;border-radius:99px;padding:12px 22px}.row span.on{background:var(--lime);color:#000;border-color:var(--lime);font-weight:600}
p.l{max-width:40ch;opacity:.75;margin:28px 0 0;font-size:19px}
</style></head><body><div class="bg"></div>
<nav><b>PULSE</b><a href="#">Book first class free</a></nav>
<section class="hero"><div class="s"></div><h1>Move<br><span>harder.</span><br>Feel it.</h1><p class="l">Small-group strength and conditioning. Coaches who know your name.</p><div class="row"><span class="on">HIIT 07:00</span><span>Strength 12:30</span><span>Mobility 18:00</span><span>Boxing 20:00</span></div></section></body></html>
